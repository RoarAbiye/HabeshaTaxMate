<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        label {
            display: inline-block;
            margin: 10px 0 5px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #results {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Pay Calculator</h1>
    <label for="calculationType">Select Calculation:</label>
    <select id="calculationType" onchange="updateForm()">
        <option value="incomeTax">Calculate Income Tax</option>
        <option value="netPay">Calculate Net Pay</option>
        <option value="grossPay">Calculate Gross Pay</option>
    </select>

    <div id="formContainer">
        <label id="payLabel">Gross Pay (ETB):</label>
        <input type="number" id="payInput" step="0.01" min="0" required />
        <div id="options" style="display: none;">
            <label><input type="checkbox" id="pension" /> Include Pension (7%)</label><br>
            <label><input type="checkbox" id="conveyance" onclick="toggleConveyanceInput()" /> Include Conveyance Allowance</label><br>
            <input type="number" id="conveyanceValue" placeholder="Enter custom value (default min(2200, gross/4))" style="display: none;" min="0" step="0.01" />
            <label><input type="checkbox" id="transport" onclick="toggleTransportInput()" /> Include Transport Allowance</label><br>
            <input type="number" id="transportValue" placeholder="Enter custom value (default 600)" style="display: none;" min="0" step="0.01" />
        </div>
    </div>

    <button id="calculateButton" onclick="calculate()">Calculate</button>
    <div id="results"></div>

    <script>
        // Income Tax Calculation
        function getIncomeTax(grossPay) {
            let taxRate = 0;
            let deduction = 0;
            if (grossPay <= 2000) return 0;
            else if (grossPay <= 4000) { taxRate = 0.15; deduction = 300.15; }
            else if (grossPay <= 7000) { taxRate = 0.2; deduction = 500.2; }
            else if (grossPay <= 10000) { taxRate = 0.25; deduction = 850.25; }
            else if (grossPay <= 14000) { taxRate = 0.3; deduction = 1350.3; }
            else { taxRate = 0.35; deduction = 2050.30; }
            return grossPay * taxRate - deduction;
        }

        // Pension Calculation (7% of gross pay)
        function getPension(grossPay) {
            const pensionRate = 0.07;
            return grossPay * pensionRate;
        }

        // Conveyance Allowance Calculation (default)
        function getDefaultConvAllowance(gross) {
            return Math.min(2200, gross / 4);
        }

        // Compute Net Pay
        function computeNetPay(G, T, C, includePension, includeConveyance, includeTransport) {
            const defaultConv = includeConveyance ? getDefaultConvAllowance(G) : 0;
            const convValue = includeConveyance ? (C ? C : defaultConv) : 0;
            const taxableConv = convValue > defaultConv ? convValue - defaultConv : 0;
            const nonTaxableConv = includeConveyance ? (convValue <= defaultConv ? convValue : defaultConv) : 0;
            const taxableTransport = includeTransport && T > 600 ? T - 600 : 0;
            const nonTaxableTransport = includeTransport ? (T <= 600 ? T : 600) : 0;
            const taxableIncome = G + taxableTransport + taxableConv;
            const incomeTax = getIncomeTax(taxableIncome);
            const _pension = includePension ? getPension(G) : 0;
            return taxableIncome - incomeTax - _pension + nonTaxableTransport + nonTaxableConv;
        }

        // Gross Pay Calculation using Newton's Method
        function getGrossPay(netPay, T, C, includePension, includeConveyance, includeTransport, initialGuess = netPay, tolerance = 0.0001, maxIterations = 1000) {
            let G = initialGuess;
            let iterations = 0;
            let epsilon = 0.0001;
            while (iterations < maxIterations) {
                const netPayGuess = computeNetPay(G, T, C, includePension, includeConveyance, includeTransport);
                const difference = netPayGuess - netPay;
                if (Math.abs(difference) < tolerance) return G;
                const netPayGuessPlusEpsilon = computeNetPay(G + epsilon, T, C, includePension, includeConveyance, includeTransport);
                const derivative = (netPayGuessPlusEpsilon - netPayGuess) / epsilon;
                if (Math.abs(derivative) < tolerance) return G;
                G = G - difference / derivative;
                iterations++;
            }
            return G;
        }

        // Currency Formatter
        function formater(number) {
            return new Intl.NumberFormat("en-US", { style: "currency", currency: "ETB" }).format(number);
        }

        // Update form based on calculation type
        function updateForm() {
            const type = document.getElementById('calculationType').value;
            const payLabel = document.getElementById('payLabel');
            const options = document.getElementById('options');
            const payInput = document.getElementById('payInput');
            payInput.value = ''; // Reset input
            if (type === 'incomeTax') {
                payLabel.textContent = 'Gross Pay (ETB):';
                options.style.display = 'none';
            } else if (type === 'netPay') {
                payLabel.textContent = 'Gross Pay (ETB):';
                options.style.display = 'block';
            } else if (type === 'grossPay') {
                payLabel.textContent = 'Net Pay (ETB):';
                options.style.display = 'block';
            }
            document.getElementById('results').style.display = 'none';
            toggleTransportInput();
            toggleConveyanceInput();
        }

        // Toggle transport value input visibility
        function toggleTransportInput() {
            const transportChecked = document.getElementById('transport').checked;
            document.getElementById('transportValue').style.display = transportChecked ? 'block' : 'none';
        }

        // Toggle conveyance value input visibility
        function toggleConveyanceInput() {
            const conveyanceChecked = document.getElementById('conveyance').checked;
            document.getElementById('conveyanceValue').style.display = conveyanceChecked ? 'block' : 'none';
        }

        // Perform calculation and display results
        function calculate() {
            const type = document.getElementById('calculationType').value;
            const payInput = document.getElementById('payInput').value;
            const pay = parseFloat(payInput);
            if (isNaN(pay) || pay < 0) {
                alert('Please enter a valid positive number.');
                return;
            }
            const pension = document.getElementById('pension').checked;
            const conveyance = document.getElementById('conveyance').checked;
            const transport = document.getElementById('transport').checked;
            const transportValueInput = document.getElementById('transportValue').value;
            const T = transport ? (transportValueInput ? parseFloat(transportValueInput) : 600) : 0;
            const conveyanceValueInput = document.getElementById('conveyanceValue').value;
            const C = conveyance ? (conveyanceValueInput ? parseFloat(conveyanceValueInput) : null) : 0;
            let results = '';

            if (type === 'incomeTax') {
                const incomeTax = getIncomeTax(pay);
                results = `Income Tax: ${formater(incomeTax)}`;
            } else if (type === 'netPay') {
                const grossPay = pay;
                const defaultConv = getDefaultConvAllowance(grossPay);
                const convValue = conveyance ? (C ? C : defaultConv) : 0;
                const taxableConv = convValue > defaultConv ? convValue - defaultConv : 0;
                const nonTaxableConv = conveyance ? (convValue <= defaultConv ? convValue : defaultConv) : 0;
                const taxableTransport = T > 600 ? T - 600 : 0;
                const nonTaxableTransport = T <= 600 ? T : 600;
                const taxableIncome = grossPay + taxableTransport + taxableConv;
                const incomeTax = getIncomeTax(taxableIncome);
                const _pension = pension ? getPension(grossPay) : 0;
                const netPay = computeNetPay(grossPay, T, C, pension, conveyance, transport);
                results = `
                    Net Pay: ${formater(netPay)}<br>
                    Taxable Income: ${formater(taxableIncome)}<br>
                    Income Tax: ${formater(incomeTax)}<br>
                    Pension: ${formater(_pension)}<br>
                    Conveyance (Total): ${formater(convValue)}<br>
                    Conveyance (Non-Taxable): ${formater(nonTaxableConv)}<br>
                    Conveyance (Taxable): ${formater(taxableConv)}<br>
                    Transport (Total): ${formater(T)}<br>
                    Transport (Non-Taxable): ${formater(nonTaxableTransport)}<br>
                    Transport (Taxable): ${formater(taxableTransport)}
                `;
            } else if (type === 'grossPay') {
                const targetNetPay = pay;
                const grossPay = getGrossPay(targetNetPay, T, C, pension, conveyance, transport);
                const defaultConv = getDefaultConvAllowance(grossPay);
                const convValue = conveyance ? (C ? C : defaultConv) : 0;
                const taxableConv = convValue > defaultConv ? convValue - defaultConv : 0;
                const nonTaxableConv = conveyance ? (convValue <= defaultConv ? convValue : defaultConv) : 0;
                const taxableTransport = T > 600 ? T - 600 : 0;
                const nonTaxableTransport = T <= 600 ? T : 600;
                const taxableIncome = grossPay + taxableTransport + taxableConv;
                const incomeTax = getIncomeTax(taxableIncome);
                const _pension = pension ? getPension(grossPay) : 0;
                const calculatedNetPay = computeNetPay(grossPay, T, C, pension, conveyance, transport);
                results = `
                    Gross Pay: ${formater(grossPay)}<br>
                    Taxable Income: ${formater(taxableIncome)}<br>
                    Income Tax: ${formater(incomeTax)}<br>
                    Pension: ${formater(_pension)}<br>
                    Conveyance (Total): ${formater(convValue)}<br>
                    Conveyance (Non-Taxable): ${formater(nonTaxableConv)}<br>
                    Conveyance (Taxable): ${formater(taxableConv)}<br>
                    Transport (Total): ${formater(T)}<br>
                    Transport (Non-Taxable): ${formater(nonTaxableTransport)}<br>
                    Transport (Taxable): ${formater(taxableTransport)}<br>
                    Calculated Net Pay: ${formater(calculatedNetPay)}
                `;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = results;
            resultsDiv.style.display = 'block';
        }

        // Initialize form on page load
        updateForm();
    </script>
</body>

</html>
